manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # Versión fijada (recomendado). Con v0.3 el board se llama
      # "seeeduino_xiao_ble" (ver build.yaml).
      # Si algún día pasas a main / v0.4+ (Zephyr 4.1), el board se renombra
      # a "xiao_ble//zmk" y hay que cambiarlo en build.yaml y en
      # .github/workflows/build.yml.
      revision: v0.3
      import: app/west.yml
  self:
    path: config
