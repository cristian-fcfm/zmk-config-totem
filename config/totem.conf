# TOTEM · configuración de firmware (Kconfig)
# Se aplica a las dos mitades. Todo lo de aquí es compile-time:
# si cambias algo hay que recompilar y reflashear.

# --- Mouse keys (capa MOUSE) -------------------------------------------------
# Sin esto, &mmv / &msc / &mkp no compilan.
# OJO: al activar esto cambia el HID descriptor -> hay que desemparejar y
# volver a emparejar el teclado en cada host (o reiniciar el host si es USB).
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_DEFAULT_MOVE_VAL=1200
CONFIG_ZMK_POINTING_DEFAULT_SCRL_VAL=20

# --- Combos ------------------------------------------------------------------
# Por defecto ZMK permite pocos combos por tecla; la posición 17 (K) participa
# en dos (Esc y Bksp), así que subimos el margen.
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=4

# --- Energía (batería) -------------------------------------------------------
CONFIG_ZMK_SLEEP=y
# Dormir tras 30 min de inactividad (ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Apagar la pantalla/estado de actividad tras 30 s (ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# --- Bluetooth ---------------------------------------------------------------
# Más potencia de transmisión: mejor alcance y enlace entre mitades,
# a costa de algo de batería. Coméntalo si prefieres autonomía.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Debounce ----------------------------------------------------------------
# Equivalente al debounce de QMK. 5/5 es el default de ZMK; bajarlo da
# respuesta más rápida, subirlo evita dobles pulsaciones en switches gastados.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=4
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=6
